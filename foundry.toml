[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "osaka"
# Sepolia (Nov 2026) prices contract code at ~1,400 gas per byte and caps a transaction at 2^24 gas, so the
# unoptimized FifoRedeemVault (17.7 KB, ~28M gas to deploy) no longer fits in one transaction. With these settings
# it is 8.8 KB and deploys for ~14.2M gas.
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 1024

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 256
depth = 100
fail_on_revert = true
